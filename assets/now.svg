<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="720" height="44" fill="url(#bg2)"/>
  <rect x="0" y="0" width="720" height="1" fill="#21262d"/>
  <rect x="0" y="43" width="720" height="1" fill="#21262d"/>

  <text x="12" y="14" font-family="'Courier New', monospace" font-size="11" fill="#5ac54f" opacity="0.6">
    &gt;
  </text>

  <!-- Tagline 1: visible 0-3s -->
  <text x="24" y="28" font-family="'Courier New', monospace" font-size="14" fill="#478CBF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.33;1" dur="12s" repeatCount="indefinite"/>
    the ideas folder is winning 41 to 3
  </text>

  <!-- Tagline 2: visible 4-7s -->
  <text x="24" y="28" font-family="'Courier New', monospace" font-size="14" fill="#5ac54f">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.57;0.66;1" dur="12s" repeatCount="indefinite"/>
    16x16 is the biggest canvas I can finish in one sitting
  </text>

  <!-- Tagline 3: visible 8-11s -->
  <text x="24" y="28" font-family="'Courier New', monospace" font-size="14" fill="#b076f5">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.67;0.90;1" dur="12s" repeatCount="indefinite"/>
    placeholder sound effects made with my own mouth
  </text>

  <!-- Blinking cursor at right -->
  <rect x="692" y="14" width="8" height="18" fill="#5ac54f" rx="1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
